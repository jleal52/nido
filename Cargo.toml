[package]
name = "nido"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Gestor de sesiones de terminal (sobre todo Claude Code), por web y por terminal"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
libc = "0.2"
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "net", "io-util", "io-std", "fs"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
unicode-width = "0.2"
vt100 = "0.18.1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
libc = "0.2"
tempfile = "3"
# El reloj parado de las pruebas (`start_paused`).
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
