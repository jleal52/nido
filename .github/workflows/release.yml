# Al subir una etiqueta vX.Y.Z: pruebas y, si pasan, los ejecutables de cada sistema en una
# versión de GitHub (con sus sumas SHA-256).
name: Publicar versión

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta ya subida (p. ej. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Pruebas (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --locked

  build:
    name: ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc de Ubuntu 22.04 (2.35): vale para Debian 12, Ubuntu 22.04+, Fedora 36+…
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }} && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Empaquetar (Linux y macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="nido-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/nido" README.md LICENSE "dist/$name/"
          cp -r contrib "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "nido-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/nido.exe", "target/${{ matrix.target }}/release/nidow.exe", README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          "ASSET=dist/$name.zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # Firma los ejecutables de macOS con un certificado «Developer ID Application». Sin una firma
  # estable, macOS reconoce nido por su huella, que cambia en cada versión, y olvida los permisos
  # (Descargas, Documentos…) que se le dieron: las sesiones se quedan esperando a que se vuelvan a
  # dar. Este trabajo no compila nada ni usa acciones de terceros: solo baja lo ya compilado y lo
  # firma. Los secretos están en el entorno «firma» (solo etiquetas v* y main). Si no están (en un
  # fork, p. ej.), se publica sin firmar.
  sign-macos:
    name: Firmar (${{ matrix.target }})
    needs: build
    environment: firma
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist
      - name: Firmar
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$P12" ]; then echo "Sin certificado: se publica sin firmar."; exit 0; fi
          kc="$RUNNER_TEMP/firma.keychain-db"
          kcpass=$(openssl rand -hex 24)
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          umask 077
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/c.p12"
          echo "p12: $(wc -c < "$RUNNER_TEMP/c.p12" | tr -d ' ') bytes"
          security import "$RUNNER_TEMP/c.p12" -k "$kc" -P "$P12_PASS" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/c.p12"
          # Solo números: el registro es público.
          certs=$(security find-certificate -a "$kc" | grep -c '"labl"' || true)
          keys=$(security dump-keychain "$kc" | grep -c 'class: 0x00000010' || true)
          echo "certificados: $certs, claves privadas: $keys"
          [ "$keys" -gt 0 ] || { echo "El .p12 no lleva la clave privada: expórtalo desde «Mis certificados» en Acceso a Llaveros."; exit 1; }
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          id=$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application/ {print $2; exit}')
          [ -n "$id" ] || { echo "No hay una identidad «Developer ID Application» válida en el .p12"; security find-identity -p codesigning "$kc" | sed -E 's/"[^"]*"/"…"/'; exit 1; }
          name="nido-${{ matrix.target }}"
          mkdir work
          tar -xzf "dist/$name.tar.gz" -C work
          # Sin hardened runtime: no se notariza, y con él macOS pediría permisos (entitlements)
          # para lo que hacen las sesiones que nido lanza.
          codesign --force --timestamp --identifier io.github.jleal52.nido --sign "$id" --keychain "$kc" "work/$name/nido"
          codesign --verify --strict --verbose=2 "work/$name/nido"
          codesign -d -r- "work/$name/nido"
          tar -C work -czf "dist/$name.tar.gz" "$name"
          security delete-keychain "$kc"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/nido-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          overwrite: true

  release:
    name: Versión en GitHub
    needs: [build, sign-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas SHA-256
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "nido $TAG" --generate-notes
          fi
